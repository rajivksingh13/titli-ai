plugins {
    id 'java'
    id 'application'
}

group = 'com.titliai.java.adk.ai.agent'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation("org.springframework.boot:spring-boot-starter-web")
    implementation("com.google.adk:google-adk:0.1.0")
    // https://mvnrepository.com/artifact/com.google.adk/google-adk-dev
    implementation("com.google.adk:google-adk-dev:0.1.0")
    implementation("org.apache.httpcomponents.client5:httpclient5:5.5") // or latest stable version
    testImplementation(platform("org.junit:junit-bom:5.9.1"))
    testImplementation("org.junit.jupiter:junit-jupiter")
}

application {
    mainClass = 'com.titliai.java.adk.ai.agent.AdkLLMAgent'
}

test {
    useJUnitPlatform()
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

task runAdkServer(type: JavaExec) {
    group = "application"
    description = "Runs the ADK Web Server"
    mainClass = "com.google.adk.web.AdkWebServer"
    classpath = sourceSets.main.runtimeClasspath
    args = ["--adk.agents.source-dir=src/main/java"]
}